  "body": "## Context\n\n- Digital-signature governance spans signature families, baseline levels, container forms, timestamping, validation reports, PKI and revocation inputs, long-term archival evidence, cryptographic suite policy, PDF and XML syntax layers, and legal-assurance wording.\n- The pack must not encode every adjacent standard as a conformance claim before the target set is reviewed and split into governed behavior surfaces.\n\n## Decision\n\n- This pack starts with a standards-target review phase.\n- Candidate ETSI, ISO, W3C, IETF, and regulatory targets are listed in docs/standards/signature-and-container-standards-matrix.md.\n- Only reviewed targets will be promoted into durable ADRs and SPECs.\n- Regulatory frameworks such as eIDAS are treated as claim-language boundaries unless a downstream repository supplies explicit legal or certification evidence.\n\n## Consequences\n\n- The first publishable pack can ship a seed review contract without implying full PAdES, XAdES, CAdES, ASiC, timestamping, or validation-report conformance.\n- Future ADRs and SPECs can be split by signature family, baseline level, container behavior, validation semantics, archival behavior, and assurance claim boundary.\n- Downstream projects can consume the seed documents while still making explicit inclusion decisions.\n"
